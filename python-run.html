<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Online Interpreter | Lab Exam Master</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border: #e2e8f0;
            --error: #ef4444;
            --radius-md: 10px;
            --font-sans: 'Outfit', 'Inter', system-ui, sans-serif;
            --font-mono: 'Fira Code', 'JetBrains Mono', monospace;
        }

        body {
            margin: 0;
            font-family: var(--font-sans);
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: var(--card-bg);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #0f172a;
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .main-content {
            display: flex;
            flex: 1;
            padding: 1rem;
            gap: 1rem;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .main-content {
                flex-direction: row;
                padding: 2rem;
            }
        }

        .editor-pane,
        .output-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .pane-header {
            padding: 0.75rem 1rem;
            background: #f1f5f9;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea.code-editor {
            flex: 1;
            width: 100%;
            border: none;
            resize: none;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            background: #fafafa;
            color: #1e293b;
            tab-size: 4;
        }

        pre.output-area {
            flex: 1;
            margin: 0;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            white-space: pre-wrap;
            overflow-y: auto;
            background: #1e1e1e;
            color: #d4d4d4;
        }

        .error-text {
            color: #fca5a5;
        }

        .error-line {
            color: #fbbf24;
            font-weight: bold;
        }

        .error-type {
            color: #f87171;
            font-weight: bold;
        }

        .run-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .run-btn:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .run-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            background: #dcfce7;
            color: #166534;
            font-weight: 600;
        }

        .status-badge.loading {
            background: #fef3c7;
            color: #92400e;
        }
    </style>
</head>

<body>
    <header>
        <h1>Python Sandbox</h1>
        <span id="engine-status" class="status-badge loading">Loading Engine...</span>
        <a href="./" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back to Practice
        </a>
    </header>

    <div class="main-content">
        <div class="editor-pane">
            <div class="pane-header">
                <span>Code Editor</span>
                <button id="run-btn" class="run-btn" disabled>Loading Engine...</button>
            </div>
            <textarea id="code-editor" class="code-editor" spellcheck="false"
                placeholder="# Write your Python code here...&#10;print('Hello, Web!')"></textarea>
        </div>

        <div class="output-pane">
            <div class="pane-header">
                <span>Terminal Output</span>
                <button id="clear-btn" class="run-btn"
                    style="background:#ef4444; padding: 0.25rem 0.75rem;">Clear</button>
            </div>
            <pre id="output-area" class="output-area">Initializing Python engine + NumPy, please wait...</pre>
        </div>
    </div>

    <script>
        let pyodideInstance = null;
        const runBtn = document.getElementById('run-btn');
        const clearBtn = document.getElementById('clear-btn');
        const editor = document.getElementById('code-editor');
        const outputArea = document.getElementById('output-area');
        const statusBadge = document.getElementById('engine-status');

        async function main() {
            try {
                pyodideInstance = await loadPyodide();

                // Pre-load NumPy
                try {
                    await pyodideInstance.loadPackage(['numpy']);
                } catch (e) {
                    console.warn("NumPy pre-load failed:", e);
                }

                // Setup: mock input() to use JavaScript prompt()
                pyodideInstance.runPython(`
import sys, io

class CaptureOutput:
    def __init__(self):
        self.output = ""
    def write(self, string):
        self.output += string
    def flush(self):
        pass

sys.stdout = CaptureOutput()
sys.stderr = CaptureOutput()

# Mock input() to use JavaScript prompt dialog
import builtins as _builtins
def _browser_input(prompt_text=""):
    from js import prompt
    result = prompt(prompt_text)
    if result is None:
        result = ""
    # Also print the prompt + input to stdout so user sees it
    sys.stdout.write(str(prompt_text) + str(result) + "\\n")
    return result
_builtins.input = _browser_input
                `);

                outputArea.innerHTML = "Python 3.11.3 (Pyodide) ready. NumPy loaded.\n<span style='color:#10b981'>✓ input() works via browser prompt dialogs</span>\n>>> ";
                runBtn.textContent = "▶ Run Code";
                runBtn.disabled = false;
                statusBadge.textContent = "Ready";
                statusBadge.classList.remove("loading");
            } catch (err) {
                outputArea.innerHTML = "<span class='error-text'>Failed to load Python engine. Please check your internet connection.</span>";
                statusBadge.textContent = "Error";
            }
        }

        main();

        runBtn.addEventListener('click', async () => {
            if (!pyodideInstance) return;

            const code = editor.value;
            runBtn.textContent = "Running...";
            runBtn.disabled = true;
            outputArea.innerHTML = "";

            try {
                // Reset stdout/stderr buffer
                pyodideInstance.runPython(`
sys.stdout.output = ""
sys.stderr.output = ""
                `);

                // Re-inject input mock (in case user overwrote it)
                pyodideInstance.runPython(`
import builtins as _builtins
def _browser_input(prompt_text=""):
    from js import prompt
    result = prompt(prompt_text)
    if result is None:
        result = ""
    sys.stdout.write(str(prompt_text) + str(result) + "\\n")
    return result
_builtins.input = _browser_input
                `);

                await pyodideInstance.runPythonAsync(code);

                // Get captured output
                const output = pyodideInstance.runPython("sys.stdout.output");
                outputArea.textContent = output + "\n>>> ";
            } catch (err) {
                // Get any output before the error
                const prevOutput = pyodideInstance.runPython("sys.stdout.output");

                // Parse the Python error for better display
                const formattedError = formatPythonError(err.toString());
                outputArea.innerHTML = escapeHTML(prevOutput) + formattedError + "\n>>> ";
            } finally {
                runBtn.textContent = "▶ Run Code";
                runBtn.disabled = false;
            }
        });

        clearBtn.addEventListener('click', () => {
            outputArea.textContent = ">>> ";
        });

        function formatPythonError(errorStr) {
            // Parse Python traceback to highlight error type, line numbers
            const lines = errorStr.split('\n');
            let formatted = '';

            for (const line of lines) {
                const escaped = escapeHTML(line);

                // Highlight line references: "File ..., line X"
                if (/File\s+.*,\s+line\s+\d+/.test(line)) {
                    const highlighted = escaped.replace(
                        /(line\s+)(\d+)/g,
                        '$1<span class="error-line">$2</span>'
                    );
                    formatted += '<span class="error-text">  ' + highlighted + '</span>\n';
                }
                // Highlight the error type line: "SomeError: message"
                else if (/^\w*(Error|Exception)\s*:/.test(line.trim())) {
                    const parts = line.trim().match(/^(\w+(?:Error|Exception))\s*:\s*(.*)/);
                    if (parts) {
                        formatted += '<span class="error-type">' + escapeHTML(parts[1]) + '</span><span class="error-text">: ' + escapeHTML(parts[2]) + '</span>\n';
                    } else {
                        formatted += '<span class="error-type">' + escaped + '</span>\n';
                    }
                }
                // Highlight "SyntaxError" or standalone error names
                else if (/^\w*(Error|Exception)$/.test(line.trim())) {
                    formatted += '<span class="error-type">' + escaped + '</span>\n';
                }
                // Caret line (^) pointing to the error
                else if (/^\s*\^+/.test(line)) {
                    formatted += '<span class="error-line">' + escaped + '</span>\n';
                }
                // Regular traceback lines
                else {
                    formatted += '<span class="error-text">' + escaped + '</span>\n';
                }
            }

            return formatted;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Support Tab key in textarea
        editor.addEventListener('keydown', function (e) {
            if (e.key == 'Tab') {
                e.preventDefault();
                var start = this.selectionStart;
                var end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });
    </script>
</body>

</html>
